# DEVELOPMENT ONLY. Active only with the explicit profile `dev` (the `demo` profile implies it). Never use in production:
# StartupSafetyEnvironmentPostProcessor refuses every other profile that relies on these defaults.
#
# Defaults point at the docker-compose database (synthetic data only, published on 127.0.0.1 only). Override with env
# vars; the recommended local setup (.env.local) runs as the restricted role mandi_app and Flyway as the owner.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mandi_demo}
spring.datasource.username=${DB_USER:mandi}
spring.datasource.password=${DB_PASSWORD:mandi_dev_only}
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5433/mandi_demo}}
spring.flyway.user=${MIGRATION_DB_USER:${DB_USER:mandi}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:mandi_dev_only}}
# Convenient default: a privileged runtime role only logs a warning. Set MANDI_REQUIRE_RESTRICTED_DB_ROLE=true
# (as .env.example does) to practise the production behaviour.
mandi.db.require-restricted-role=${MANDI_REQUIRE_RESTRICTED_DB_ROLE:false}
# Older dev databases recorded the demo seed as V1000 (a version above every schema migration). Ignoring
# 'future' and 'missing' lets such a database start with or without the demo profile once all schema migrations
# are applied. Set BOTH patterns (setting only one silently drops Flyway's default). If such a database is behind on
# schema migrations, start it once with the demo profile (it allows out-of-order) or recreate it.
spring.flyway.ignore-migration-patterns=*:missing,*:future

# ---- Authentication, development only: plain HTTP on localhost -----------------------------------------------
# An unprefixed, non-Secure session cookie (a browser will not keep a Secure cookie over http://localhost on every setup).
server.servlet.session.cookie.name=mandi_session
server.servlet.session.cookie.secure=false
mandi.security.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100
# Not a secret: a development key. Production refuses to start without MANDI_SECURITY_HMAC_KEY.
mandi.security.hmac-key=${MANDI_SECURITY_HMAC_KEY:development-only-hmac-key-0123456789-abcdef}

# ---- Onboarding, development only ----------------------------------------------------------------------------------------
# Invitation "emails" are captured in memory and readable at GET /api/v1/dev/mail (raw links; never in production).
mandi.mail.dev-sink=true
mandi.public-base-url=${MANDI_PUBLIC_BASE_URL:http://localhost:3000}
