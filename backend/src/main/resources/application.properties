spring.application.name=mandi-backend
server.port=${SERVER_PORT:8081}
# Bind to loopback only. A deliberate non-local deployment sets SERVER_ADDRESS (for example 0.0.0.0) AND
# MANDI_ALLOW_NON_LOOPBACK=true; start-up refuses a non-loopback address without that second switch
# (StartupSafetyEnvironmentPostProcessor, docs/RUNNING.md "Deliberate non-local deployment").
server.address=${SERVER_ADDRESS:127.0.0.1}
mandi.network.allow-non-loopback=${MANDI_ALLOW_NON_LOOPBACK:false}

# THIS FILE IS THE SAFE (PRODUCTION-LIKE) BASELINE. It contains NO database defaults, so a start without explicit
# configuration fails clearly instead of falling back to the owner role or a documented password. Local convenience
# lives in application-dev.properties and is active only with the explicit profile `dev` (the `demo` profile implies it).
# Required in every non-dev profile (see StartupSafetyEnvironmentPostProcessor):
#   RUNTIME connection (the web application): the restricted role mandi_app (docs/DB_BACKUP_AND_ROLES.md)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Connection pool: explicit so the budget is visible (this equals the Hikari default). The runtime role is limited to
# 30 connections in total (scripts/db/setup-runtime-role.sh), so (instances x pool size) + ad-hoc sessions must stay
# below 30. See docs/DB_BACKUP_AND_ROLES.md, "Connection budget".
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
#   MIGRATION connection (Flyway only): the schema owner, a DIFFERENT role from the runtime one. No fallback.
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL}}
spring.flyway.user=${MIGRATION_DB_USER}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
# Refuse to start if the runtime role is a superuser or owns the tables. Always on here; only the dev profile relaxes it.
mandi.db.require-restricted-role=true

# `demo` is a development-only convenience: it implies `dev` (database defaults, synthetic seed, demo calculation).
spring.profiles.group.demo=demo,dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Needed by V5 (CREATE INDEX CONCURRENTLY): by default Flyway keeps a transaction open on its first connection while it
# holds the migration lock, and a concurrent index build on its second connection then waits for that transaction
# forever (observed: the migration hung). A session-level lock holds no transaction. Still one migrator at a time.
spring.flyway.postgresql.transactional-lock=false
# (The tolerant ignore-migration-patterns for older dev databases is in application-dev.properties only, so
# production keeps Flyway's own checks.)

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health,info

# Demonstration calculation is OFF unless explicitly enabled (see docs/ASSUMPTIONS.md). Only dev/test may enable it.
mandi.calculation.demo-enabled=false

# Reject fractional values for whole-number fields (e.g. pieces 2.5) instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# ---- Authentication and sessions (P1-04; blueprint section 6) -------------------------------------------------
# Server-side sessions in PostgreSQL. The tables are created by migration V8, never by Spring.
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */5 * * * *
# Session cookie, production-like: __Host- prefix (needs Secure, Path=/ and no Domain), HttpOnly, SameSite=Lax, no Max-Age
# (a browser-session cookie; its lifetime is not a security control). StartupSafetyEnvironmentPostProcessor refuses to start
# outside dev/test if any of this is weakened. Development over plain HTTP overrides it in application-dev.properties.
server.servlet.session.cookie.name=__Host-mandi_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Idle timeout (sliding, enforced by the session store); the ABSOLUTE limit is enforced by SessionPolicyFilter.
server.servlet.session.timeout=PT30M
mandi.security.session.idle-timeout=PT30M
mandi.security.session.absolute-lifetime=PT18H
# No defaults here: required outside dev/test. Allowed origins = the public address(es) of the web application, comma separated.
mandi.security.allowed-origins=${MANDI_ALLOWED_ORIGINS}
# Key for the keyed hashes of emails and addresses in the security log and the login throttle (at least 32 characters; a secret).
mandi.security.hmac-key=${MANDI_SECURITY_HMAC_KEY}

# ---- Onboarding (P1-07) ----------------------------------------------------------------------------------------------
# No email provider exists yet (open decision): with no dev sink, inviting an employee answers 503 EMAIL_NOT_CONFIGURED and
# stores nothing. The development sink (links readable at /api/v1/dev/mail) is refused outside the dev and test profiles.
mandi.mail.dev-sink=false
# Public address of the web application, used in invitation links. Empty = invitations cannot be created.
mandi.public-base-url=${MANDI_PUBLIC_BASE_URL:}
