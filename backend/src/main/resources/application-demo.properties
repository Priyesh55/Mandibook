# Demo profile: synthetic seed data + opt-in unverified demonstration calculation.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
mandi.calculation.demo-enabled=true
# Databases that ran an earlier demo build recorded the old seed as V1000; allow newer schema migrations
# (V3, V4, ...) to apply to them. Not enabled outside the demo profile.
spring.flyway.out-of-order=true
