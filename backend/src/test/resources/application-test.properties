# Profile `test` (set by Surefire). Placeholders ONLY, so Spring's Flyway auto-configuration can evaluate its conditions
# before TestcontainersConfiguration injects the real values (its DynamicPropertyRegistrar overrides every key below).
# They point at a closed port: if an injection were ever missing, a test fails loudly instead of reaching any database.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/injected-by-testcontainers
spring.datasource.username=injected
spring.datasource.password=injected
spring.flyway.url=jdbc:postgresql://127.0.0.1:1/injected-by-testcontainers
spring.flyway.user=injected
spring.flyway.password=injected

# Authentication under test: plain HTTP to a random local port, so the session cookie is unprefixed and not Secure; one test
# class turns the production-like cookie settings back on to check the headers. Values are synthetic.
server.servlet.session.cookie.name=mandi_session
server.servlet.session.cookie.secure=false
mandi.security.allowed-origins=http://localhost:3000
mandi.security.hmac-key=test-only-hmac-key-0123456789-abcdefghijkl
mandi.security.bcrypt-cost=10

mandi.mail.dev-sink=true
mandi.public-base-url=http://localhost:3000
